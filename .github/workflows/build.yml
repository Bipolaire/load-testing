name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Tests et clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lt-core -p lt-engine -p lt-cli
      - run: cargo clippy -p lt-core -p lt-engine -p lt-cli --all-targets -- -D warnings

  package:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            config: macos-arm64
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            config: macos-x64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            config: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Installer cargo-packager
        shell: bash
        run: |
          if ! cargo packager --version >/dev/null 2>&1; then
            cargo install cargo-packager --locked --version 0.11.8
          fi

      - name: Compiler l'application et la CLI
        run: cargo build --release --target ${{ matrix.target }} -p lt-app -p lt-cli

      - name: Clippy lt-app (plateforme native)
        run: cargo clippy -p lt-app --all-targets -- -D warnings

      - name: Générer le paquet (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cargo packager -c "$(python3 scripts/packager-config.py ${{ matrix.config }})"

      - name: Générer le paquet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = python scripts/packager-config.py ${{ matrix.config }}
          cargo packager -c $config

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Load-Testing-${{ matrix.config }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.app
            dist/*.exe

  package-cli:
    name: CLI ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - name: Linux ARM64 musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            musl: false
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            musl: false
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Installer musl
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Compiler lt
        run: cargo build --release --target ${{ matrix.target }} -p lt-cli

      - name: Empaqueter l'archive CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          case "$VERSION" in
            v*) ;;
            *) VERSION="0.1.0" ;;
          esac
          VERSION="${VERSION#v}"
          TARGET="${{ matrix.target }}"
          OUT_DIR="dist/cli"
          mkdir -p "$OUT_DIR"
          STAGING="$(mktemp -d)"
          BIN="target/${TARGET}/release/lt"
          cp "$BIN" "$STAGING/lt"
          chmod +x "$STAGING/lt"
          ARCHIVE="lt-v${VERSION}-${TARGET}.tar.gz"
          tar -C "$STAGING" -czf "$OUT_DIR/$ARCHIVE" lt
          (
            cd "$OUT_DIR"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
            fi
          )
          echo "Built $OUT_DIR/$ARCHIVE"
          ls -la "$OUT_DIR"

      - name: Empaqueter l'archive CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if (-not $version -or -not $version.StartsWith('v')) { $version = '0.1.0' }
          $version = $version.TrimStart('v')
          $target = '${{ matrix.target }}'
          $outDir = 'dist/cli'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $bin = "target/$target/release/lt.exe"
          if (-not (Test-Path $bin)) { throw "missing $bin" }
          $staging = Join-Path $env:TEMP ("lt-cli-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $bin (Join-Path $staging 'lt.exe')
          $archive = "lt-v$version-$target.zip"
          $archivePath = Join-Path (Resolve-Path $outDir) $archive
          Compress-Archive -Path (Join-Path $staging 'lt.exe') -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          Set-Content -Path "$archivePath.sha256" -Value "$hash  $archive`n" -NoNewline
          Write-Host "Built $archivePath"
          Get-ChildItem $outDir

      - name: Publier les artefacts CLI
        uses: actions/upload-artifact@v4
        with:
          name: lt-cli-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/cli/*.tar.gz
            dist/cli/*.zip
            dist/cli/*.sha256

  release:
    name: Publier la version
    needs: [package, package-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assembler SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" release-assets/
              done
          cd release-assets
          : > SHA256SUMS
          for f in lt-v*.tar.gz lt-v*.zip; do
            [ -f "$f" ] || continue
            if [ -f "${f}.sha256" ]; then
              cat "${f}.sha256" >> SHA256SUMS
            else
              sha256sum "$f" >> SHA256SUMS
            fi
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          name: Load Testing ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/lt-v*.tar.gz
            release-assets/lt-v*.zip
            release-assets/SHA256SUMS
